<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传素材 - 媒体素材管理系统</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">媒体素材管理系统</a>
        </div>
        <div class="nav-links">
            <a href="/">首页</a>
            <a href="/media/list">素材库</a>
        </div>
    </nav>

    <!-- 上传表单 -->
    <main class="upload-content">
        <div class="upload-container">
            <h1>上传素材</h1>
            
            <form id="uploadForm" class="upload-form">
                <!-- 文件上传区域 -->
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">
                        <svg viewBox="0 0 24 24" width="48" height="48"><path fill="currentColor" d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                    </div>
                    <p>点击或拖拽文件到此处上传</p>
                    <p class="upload-tip">支持 jpg, png, gif, mp4, mp3, pdf 等格式，最大 100MB</p>
                    <input type="file" id="fileInput" name="file" accept="image/*,video/*,audio/*,.pdf,.doc,.docx" style="display: none;">
                </div>
                
                <div class="file-preview" id="filePreview" style="display: none;">
                    <img id="previewImage" src="" alt="预览">
                    <p id="fileName"></p>
                    <button onclick="clearFile()" class="btn btn-sm">清除</button>
                </div>
                
                <!-- 素材信息 -->
                <div class="form-section">
                    <div class="form-group">
                        <label for="title">素材标题 *</label>
                        <input type="text" id="title" name="title" required placeholder="请输入素材标题">
                    </div>
                    
                    <div class="form-group">
                        <label for="description">素材描述</label>
                        <textarea id="description" name="description" rows="3" placeholder="请输入素材描述"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="categoryId">所属分类</label>
                        <select id="categoryId" name="categoryId">
                            <option value="">请选择分类</option>
                            <option th:each="cat : ${categories}" 
                                    th:value="${cat.id}" 
                                    th:text="${cat.categoryName}">分类</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="tags">标签</label>
                        <input type="text" id="tags" name="tags" placeholder="多个标签用逗号分隔，如：风景,旅行">
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="button" id="aiAnalyzeBtn" class="btn btn-secondary">🤖 AI 智能识别</button>
                    <button type="submit" class="btn btn-primary btn-large">上传素材</button>
                </div>
            </form>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script>
        let selectedFile = null;
        let aiResult = null;
        
        // 点击上传区域
        document.getElementById('uploadArea').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });
        
        // 拖拽上传
        document.getElementById('uploadArea').addEventListener('dragover', (e) => {
            e.preventDefault();
            document.getElementById('uploadArea').classList.add('dragover');
        });
        
        document.getElementById('uploadArea').addEventListener('dragleave', () => {
            document.getElementById('uploadArea').classList.remove('dragover');
        });
        
        document.getElementById('uploadArea').addEventListener('drop', (e) => {
            e.preventDefault();
            document.getElementById('uploadArea').classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });
        
        // 文件选择
        document.getElementById('fileInput').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });
        
        // 处理文件
        function handleFile(file) {
            selectedFile = file;
            document.getElementById('uploadArea').style.display = 'none';
            document.getElementById('filePreview').style.display = 'block';
            document.getElementById('fileName').textContent = file.name;
            
            // 图片预览
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('previewImage').src = e.target.result;
                    document.getElementById('previewImage').style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                document.getElementById('previewImage').style.display = 'none';
            }
        }
        
        // 清除文件
        function clearFile() {
            selectedFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('uploadArea').style.display = 'block';
            document.getElementById('filePreview').style.display = 'none';
        }
        
        // AI 智能识别：调后端视觉模型，自动回填标题/描述/标签/分类
        document.getElementById('aiAnalyzeBtn').addEventListener('click', async () => {
            if (!selectedFile) {
                alert('请先选择图片文件');
                return;
            }
            if (!selectedFile.type.startsWith('image/')) {
                alert('AI 识别仅支持图片文件');
                return;
            }
            const btn = document.getElementById('aiAnalyzeBtn');
            btn.disabled = true;
            btn.textContent = '⏳ AI 识别中...';
            try {
                const fd = new FormData();
                fd.append('file', selectedFile);
                const resp = await fetch('/api/media/ai-analyze', { method: 'POST', body: fd });
                const result = await resp.json();
                if (result.code === 200) {
                    const d = result.data;
                    if (d.fallback) {
                        alert(d.fallbackMessage || 'AI 识别失败，请手动填写');
                    } else {
                        if (d.title) document.getElementById('title').value = d.title;
                        if (d.description) document.getElementById('description').value = d.description;
                        if (d.tags && d.tags.length) document.getElementById('tags').value = d.tags.join(',');
                        if (d.categoryId) document.getElementById('categoryId').value = String(d.categoryId);
                        aiResult = { title: d.title || '', description: d.description || '', tags: d.tags || [], categoryId: d.categoryId, categoryName: d.categoryName || '' };
                        alert('AI 识别完成，已自动回填，可手动修改后再上传');
                    }
                } else {
                    alert(result.message || 'AI 识别失败，请手动填写');
                }
            } catch (e) {
                alert('AI 识别失败，请手动填写');
            } finally {
                btn.disabled = false;
                btn.textContent = '🤖 AI 智能识别';
            }
        });

        // 记录 AI 打标签 bad case（用户采纳或修改 AI 建议），供复盘迭代
        async function recordBadCase() {
            if (!aiResult) return;
            const finalTitle = document.getElementById('title').value;
            const finalDesc = document.getElementById('description').value;
            const finalTags = document.getElementById('tags').value;
            const finalCat = document.getElementById('categoryId').value;
            const adopted = (finalTitle === aiResult.title && finalTags === aiResult.tags.join(',') && String(aiResult.categoryId || '') === finalCat) ? 1 : 0;
            try {
                await fetch('/api/media/ai-badcase', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        aiTitle: aiResult.title,
                        aiDescription: aiResult.description,
                        aiTags: aiResult.tags.join(','),
                        aiCategory: aiResult.categoryName,
                        finalTitle: finalTitle,
                        finalDescription: finalDesc,
                        finalTags: finalTags,
                        finalCategoryId: finalCat ? Number(finalCat) : null,
                        adopted: adopted
                    })
                });
            } catch (e) { /* bad case 记录失败不阻塞上传 */ }
        }

        // 上传表单提交
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!selectedFile) {
                alert('请选择要上传的文件');
                return;
            }
            
            const title = document.getElementById('title').value;
            if (!title) {
                alert('请输入素材标题');
                return;
            }
            
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('title', title);
            formData.append('description', document.getElementById('description').value);
            formData.append('categoryId', document.getElementById('categoryId').value);
            formData.append('tags', document.getElementById('tags').value);
            
            try {
                const response = await fetch('/api/media/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                if (result.code === 200) {
                    await recordBadCase();
                    alert('上传成功！');
                    window.location.href = '/media/list';
                } else {
                    alert(result.message || '上传失败');
                }
            } catch (error) {
                alert('网络错误，请稍后重试');
            }
        });
    </script>
</body>
</html>
