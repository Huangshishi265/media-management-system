<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘 - 媒体素材管理系统</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">媒体素材管理系统</a>
        </div>
        <div class="nav-links">
            <a href="/">首页</a>
            <a href="/media/list">素材库</a>
            <a href="/dashboard">仪表盘</a>
            <a href="/system/user">用户管理</a>
            <a href="/media/category">分类管理</a>
        </div>
        <div class="nav-user">
            <span th:if="${session.user != null}">
                <span th:text="${session.user.nickname}">用户</span>
                <a href="#" onclick="logout()">退出</a>
            </span>
        </div>
    </nav>

    <!-- 仪表盘内容 -->
    <main class="dashboard-content">
        <div class="dashboard-header">
            <h1>系统仪表盘</h1>
            <p>实时监控素材数据和系统状态</p>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-cards">
            <div class="stat-card">
                <div class="stat-icon blue">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 16H6c-.55 0-1-.45-1-1V6c0-.55.45-1 1-1h12c.55 0 1 .45 1 1v12c0 .55-.45 1-1 1z"/></svg>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="totalMedia">--</span>
                    <span class="stat-label">素材总数</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="totalCategories">--</span>
                    <span class="stat-label">分类数量</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="totalViews">--</span>
                    <span class="stat-label">总浏览量</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="totalDownloads">--</span>
                    <span class="stat-label">总下载量</span>
                </div>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="charts-section">
            <div class="chart-container">
                <h3>素材类型分布</h3>
                <div id="mediaTypeChart" class="chart"></div>
            </div>
            <div class="chart-container">
                <h3>分类素材数量</h3>
                <div id="categoryChart" class="chart"></div>
            </div>
        </div>

        <!-- 热门素材列表 -->
        <div class="hot-media-section">
            <h2>热门素材 TOP 10</h2>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>排名</th>
                        <th>标题</th>
                        <th>类型</th>
                        <th>分类</th>
                        <th>下载次数</th>
                        <th>浏览次数</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="media, stat : ${hotMedia}">
                        <td th:text="${stat.count + 1}">1</td>
                        <td th:text="${media.title}">标题</td>
                        <td th:text="${media.mediaType}">类型</td>
                        <td th:text="${media.categoryName}">分类</td>
                        <td th:text="${media.downloadCount}">下载次数</td>
                        <td th:text="${media.viewCount}">浏览次数</td>
                        <td>
                            <a href="/media/detail/${media.id}" class="btn btn-sm">查看</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        // 初始化图表
        async function initCharts() {
            try {
                const response = await fetch('/api/dashboard/stats');
                const result = await response.json();
                
                if (result.code === 200) {
                    const data = result.data;
                    
                    // 素材类型分布饼图
                    const mediaTypeChart = echarts.init(document.getElementById('mediaTypeChart'));
                    const mediaTypeData = data.mediaTypeStats.map(item => ({
                        name: item.mediaType,
                        value: item.count
                    }));
                    mediaTypeChart.setOption({
                        tooltip: { trigger: 'item' },
                        legend: { orient: 'vertical', left: 'left' },
                        series: [{
                            type: 'pie',
                            radius: '50%',
                            data: mediaTypeData,
                            emphasis: {
                                itemStyle: {
                                    shadowBlur: 10,
                                    shadowOffsetX: 0,
                                    shadowColor: 'rgba(0, 0, 0, 0.5)'
                                }
                            }
                        }]
                    });
                    
                    // 分类素材数量柱状图
                    const categoryChart = echarts.init(document.getElementById('categoryChart'));
                    const categoryData = data.categoryStats;
                    categoryChart.setOption({
                        tooltip: { trigger: 'axis' },
                        xAxis: {
                            type: 'category',
                            data: categoryData.map(item => item.categoryName)
                        },
                        yAxis: { type: 'value' },
                        series: [{
                            data: categoryData.map(item => item.mediaCount),
                            type: 'bar',
                            itemStyle: {
                                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                    { offset: 0, color: '#667eea' },
                                    { offset: 1, color: '#764ba2' }
                                ])
                            }
                        }]
                    });
                    
                    // 更新统计卡片
                    const totalMedia = mediaTypeData.reduce((sum, item) => sum + item.value, 0);
                    document.getElementById('totalMedia').textContent = totalMedia;
                    document.getElementById('totalCategories').textContent = categoryData.length;
                }
            } catch (error) {
                console.error('加载统计数据失败:', error);
            }
        }
        
        // 页面加载完成后初始化图表
        document.addEventListener('DOMContentLoaded', initCharts);

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login';
        }
    </script>
</body>
</html>
